<style>
/* Layout: one question per screen, centered column, progress rail on top, Telegram hand-off at the end */
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --fg:#121A2E; --muted:#5B6580;
  --line:#DCE2EE; --blue:#1F3F94; --red:#CD2E3A; --blue-soft:#E6ECFA; --cloud:rgba(31,63,148,.10);
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1222; --surface:#151C31; --fg:#EEF1F8; --muted:#9AA4BF;
  --line:#26304C; --blue:#7F9EF2; --red:#F0606B; --blue-soft:#1C2848; --cloud:rgba(127,158,242,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1222; --surface:#151C31; --fg:#EEF1F8; --muted:#9AA4BF;
  --line:#26304C; --blue:#7F9EF2; --red:#F0606B; --blue-soft:#1C2848; --cloud:rgba(127,158,242,.12); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:20px 20px 32px;box-sizing:border-box}
.top{display:flex;align-items:center;gap:12px;min-height:40px}
.back{background:none;border:0;color:var(--muted);font:inherit;font-size:15px;cursor:pointer;padding:6px 0}
.back:focus-visible,.opt:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.rail{flex:1;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.rail i{display:block;height:100%;width:0;background:var(--blue);transition:width .35s ease}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:2.5em;text-align:right}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding-block:24px}
.step{animation:in .35s ease both}
@keyframes in{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step{animation:none}.track i,.plane{transition:none}}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);font-weight:600;margin:0 0 14px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,7.5vw,40px);line-height:1.15;margin:0 0 16px;text-wrap:balance}
h1 em{font-style:normal;color:var(--blue)}
h2{font-family:var(--display);font-weight:500;font-size:clamp(22px,5.8vw,28px);line-height:1.25;margin:0 0 22px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 28px;max-width:34ch}
.meta-unused{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:14px;margin-top:22px}
.meta span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:middle}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--blue);color:var(--surface);border:0;border-radius:12px;padding:16px 26px;font:600 17px var(--body);cursor:pointer;text-decoration:none}
.btn[disabled]{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--muted);margin-left:14px}
input{width:100%;box-sizing:border-box;font:500 22px var(--body);color:var(--fg);background:transparent;border:0;border-bottom:2px solid var(--line);padding:10px 2px;margin-bottom:24px}
input:focus{border-color:var(--blue);outline:none}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:12px;padding:15px 16px;font:500 17px var(--body);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--blue)}
.opt.on{border-color:var(--blue);background:var(--blue-soft)}
.key{flex:none;width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.opt.on .key{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 18px;margin:0 0 24px}
.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.row b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.row span{color:var(--muted)}
.tg{width:100%;box-sizing:border-box;padding:18px}
.tg svg{width:22px;height:22px;fill:currentColor}
.small{font-size:14px;color:var(--muted);margin:14px 0 0;text-align:center}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;color:var(--cloud)}
.sky svg{position:absolute;height:auto;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;animation:drift 14s ease-in-out infinite alternate}
.sky .c1{top:5%;right:-70px;width:min(62vw,300px)}
.sky .c2{top:46%;left:-60px;width:min(42vw,180px);transform:scaleX(-1);animation-duration:18s}
.sky .c3{bottom:5%;right:-40px;width:min(50vw,220px);animation-duration:16s}
@keyframes drift{to{translate:-14px 0}}
@media (prefers-reduced-motion:reduce){.sky svg{animation:none}}
.wrap{position:relative;z-index:1}
.stamp{display:inline-flex;flex-direction:column;align-items:center;gap:2px;border:2.5px solid var(--red);outline:1px solid var(--red);outline-offset:3px;color:var(--red);border-radius:10px;padding:10px 16px;margin:0 0 22px 4px;transform:rotate(-5deg);font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;animation:stamp .45s cubic-bezier(.2,1.4,.4,1) both}
.stamp b{font-size:13px;font-weight:700}
.stamp span{font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.04em;font-variant-numeric:tabular-nums;text-transform:none}
@keyframes stamp{from{opacity:.25;transform:rotate(-5deg) scale(1.35)}to{opacity:1;transform:rotate(-5deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}
.me{display:flex;align-items:center;gap:14px;margin:0 0 26px}
.me img{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line)}
.me b{display:block;font-weight:600;font-size:16px}
.me span{font-size:14px;color:var(--muted)}
.route{flex:1;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.track{position:relative;flex:1;height:22px}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dotted var(--line)}
.track i{position:absolute;left:0;top:50%;height:2px;margin-top:-1px;width:0;background:var(--blue);transition:width .5s ease}
.plane{position:absolute;top:50%;left:0;width:22px;height:22px;margin:-11px 0 0 -11px;color:var(--blue);transition:left .5s ease}
.plane svg{width:100%;height:100%;fill:currentColor;transform:rotate(90deg)}
.route .kr{color:var(--red)}
.skip{background:none;border:1.5px dashed var(--line);color:var(--muted);border-radius:12px;padding:13px 18px;font:500 16px var(--body);cursor:pointer;margin-top:10px}
.skip:hover{border-color:var(--blue);color:var(--fg)}
.field{margin-bottom:6px}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--blue-soft);border-radius:10px;margin:4px 0 2px}
.seg button{border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:8px 14px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.field label{display:block;font-size:14px;color:var(--muted);font-weight:600}
.brand{font-size:13px;color:var(--muted);text-align:center}
</style>
</head>

const REFUSED = ["Yo'q, birinchi topshirishim","Ha, otkaz olganman"];

const A = {name:"", status:-1, dir:-1, lang:-1, ielts:"", topik:"", enType:0, koType:0, age:"", tried:-1, refused:-1};
let pos = -1;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Javoblarga qarab savollar ketma-ketligi
function flow(){
  const f = ["name","status","dir"];
  if (A.dir < 0) return [...f, "lang", "extra"];
  if (A.dir === 0) return [...f, "age", "tried"];
  if (A.dir === 3) return [...f, "age", "refused"];
  f.push("lang");
  f.push(A.lang === 3 ? "age" : "cert");
  return f;
}

const CYR = {а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"yo",ж:"j",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"x",ц:"ts",ч:"ch",ш:"sh",щ:"sh",ъ:"",ы:"i",ь:"",э:"e",ю:"yu",я:"ya",ў:"o",қ:"q",ғ:"g",ҳ:"h"};
function latin(s){
  return s.split("").map(ch => {
    const lo = ch.toLowerCase(), t = CYR[lo];
    if (t === undefined) return ch;
    return ch === lo ? t : t.charAt(0).toUpperCase() + t.slice(1);
  }).join("").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
}
const firstNum = s => { const m = String(s).replace(",", ".").match(/\d+(\.\d)?/); return m ? m[0] : ""; };

// start payload (max 64, A-Z a-z 0-9 _ -):
// s{holat}d{yo'nalish}[l{til}][_i{I|T}{ball}][_t{T|S}{daraja}][_a{yosh}]_{ism}   (x = sertifikat yo'q)
function payload(){
  let p = `s${A.status+1}d${A.dir+1}`;
  const f = flow();
  if (f.includes("lang")) p += `l${A.lang+1}`;
  if (f.includes("cert")){
    if (A.lang === 0 || A.lang === 2){
      const c = EN_CERTS[A.enType].code, n = firstNum(A.ielts);
      p += "_i" + (n ? c + (c === "I" ? Math.round(parseFloat(n)*10) : parseInt(n,10)) : "x");
    }
    if (A.lang === 1 || A.lang === 2){
      const c = KO_CERTS[A.koType].code, n = firstNum(A.topik);
      p += "_t" + (n ? c + parseInt(n,10) : "x");
    }
  }
  if (f.includes("age")) p += "_a" + (parseInt(A.age,10) || "x");
  if (f.includes("tried")) p += "_v" + (A.tried + 1);
  if (f.includes("refused")) p += "_r" + (A.refused + 1);
  const nm = latin(A.name).slice(0, Math.max(0, 64 - p.length - 1));
  return nm ? `${p}_${nm}` : p;
}

function chrome(){
  const f = flow(), inQ = pos >= 0 && pos < f.length;
  $("back").hidden = pos < 0;
  $("count").hidden = !inQ;
  const pct = (pos < 0 ? 0 : Math.min(pos, f.length) / f.length * 100) + "%";
  $("rail").style.width = pct; $("plane").style.left = pct;
  if (inQ) $("count").textContent = `${pos+1}/${f.length}`;
}

function choice(title, key, opts){
  return `<div class="step"><h2>${title}</h2><div class="opts">${
    opts.map((o,i) => `<button class="opt ${A[key]===i?"on":""}" id="o-${key}-${i}" data-i="${i}"><span class="key">${i+1}</span>${o}</button>`).join("")
  }</div></div>`;
}
function textStep(title, fields, skipLabel){
  return `<div class="step"><h2>${title}</h2>${
    fields.map(f => `<div class="field">${f.label ? `<label for="f-${f.key}">${f.label}</label>` : ""}${
      f.types ? `<div class="seg" role="group" aria-label="Sertifikat turi">${f.types.map((t,i) => `<button type="button" id="seg-${f.key}-${i}" data-k="${f.typeKey}" data-i="${i}" class="${A[f.typeKey]===i?"on":""}">${t.name}</button>`).join("")}</div>` : ""
    }<input id="f-${f.key}" data-k="${f.key}" ${f.attrs||""} placeholder="${f.ph}" value="${esc(A[f.key])}"></div>`).join("")
  }<div><button class="btn" id="ok">Davom etish</button><span class="hint">yoki Enter</span></div>${
    skipLabel ? `<button class="skip" id="skip">${skipLabel}</button>` : ""}</div>`;
}

function render(){
  chrome();
  const m = $("main"), f = flow();
  if (pos < 0){
    m.innerHTML = `<div class="step">
      <div class="me"><img src="${AVATAR}" alt="Ikhlos Khamidov"><div><b>Ikhlos Khamidov</b><span>Qabul va viza maslahatchisi</span></div></div>
      <p class="eyebrow">한국에서 만나요 · Koreada ko'rishamiz</p>
      <h1>Men ham shu yo'ldan o'tganman. Endi <em>sizning navbatingiz.</em></h1>
      <p class="lead">Bir necha savolga javob bering — vaziyatingizni o'rganib, sizga bepul konsultatsiya beraman.</p>
      <button class="btn" id="go">Bepul konsultatsiya olish →</button>
    </div>`;
    $("go").onclick = next; $("go").focus();
    return;
  }
  if (pos >= f.length) return renderDone(m);
  const id = f[pos];
  if (id === "status"){ m.innerHTML = choice("Hozir nima bilan bandsiz?", "status", STATUS); bindChoice("status"); return; }
  if (id === "dir"){ m.innerHTML = choice("Qaysi yo'nalishga topshirmoqchisiz?", "dir", DIR); bindChoice("dir"); return; }
  if (id === "tried"){ m.innerHTML = choice("Oldin Koreya vizasiga harakat qilib ko'rganmisiz?", "tried", TRIED); bindChoice("tried"); return; }
  if (id === "refused"){ m.innerHTML = choice("Oldin Koreya vizasidan otkaz olganmisiz?", "refused", REFUSED); bindChoice("refused"); return; }
  if (id === "lang"){ m.innerHTML = choice("Qaysi tilni bilasiz?", "lang", LANG); bindChoice("lang"); return; }

  let html, required;
  if (id === "name"){
    html = textStep("Tanishib olaylik. Ismingiz nima?", [{key:"name", ph:"Masalan: Aziz", attrs:'autocomplete="given-name" maxlength="40"'}]);
    required = ["name"];
  } else if (id === "cert"){
    const fs = [];
    if (A.lang === 0 || A.lang === 2) fs.push({key:"ielts", label: A.lang === 2 ? "Ingliz tili" : "", types:EN_CERTS, typeKey:"enType", ph:EN_CERTS[A.enType].ph, attrs:'maxlength="20"'});
    if (A.lang === 1 || A.lang === 2) fs.push({key:"topik", label: A.lang === 2 ? "Koreys tili" : "", types:KO_CERTS, typeKey:"koType", ph:KO_CERTS[A.koType].ph, attrs:'maxlength="20"'});
    const t = A.lang === 0 ? "Ingliz tili sertifikatingiz bormi?" : A.lang === 1 ? "Koreys tili sertifikatingiz bormi?" : "Sertifikatlaringiz bormi?";
    html = textStep(t, fs, "Hozircha sertifikatim yo'q");
    required = fs.map(x => x.key); required.any = true;
  } else if (id === "age"){
    html = textStep("Yoshingiz nechada?", [{key:"age", ph:"Masalan: 19", attrs:'inputmode="numeric" maxlength="2"'}]);
    required = ["age"];
  }
  m.innerHTML = html;
  const inputs = [...m.querySelectorAll("input")], ok = $("ok");
  const valid = () => required.any ? required.some(k => A[k].trim()) : required.every(k => A[k].trim());
  const sync = () => { ok.disabled = !valid(); };
  inputs.forEach(inp => {
    inp.oninput = () => { A[inp.dataset.k] = inp.dataset.k === "age" ? inp.value.replace(/\D/g,"") : inp.value; if (inp.dataset.k === "age") inp.value = A.age; sync(); };
    inp.onkeydown = e => { if (e.key === "Enter" && valid()) next(); };
  });
  ok.onclick = next;
  m.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    const k = b.dataset.k, i = +b.dataset.i;
    A[k] = i;
    b.parentElement.querySelectorAll("button").forEach((x,j) => x.classList.toggle("on", j === i));
    const inp = b.parentElement.nextElementSibling;
    inp.placeholder = (k === "enType" ? EN_CERTS : KO_CERTS)[i].ph;
    inp.focus();
  });
  if ($("skip")) $("skip").onclick = () => { required.forEach(k => A[k] = ""); A.noCert = true; next(); };
  sync();
  setTimeout(() => inputs[0] && inputs[0].focus(), 50);
}

function bindChoice(key){
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(key, +b.dataset.i));
}
function pick(key, i){
  A[key] = i;
  if (key === "lang" || key === "dir"){ A.ielts = ""; A.topik = ""; A.noCert = false; }
  document.querySelectorAll(".opt").forEach((b,j) => b.classList.toggle("on", j === i));
  setTimeout(next, 220);
}

function renderDone(m){
  const link = `https://t.me/${BOT_USERNAME}?start=${payload()}`;
  m.innerHTML = `<div class="step">
    <h2>Telegram ochilmoqda…</h2>
    <p class="small">Agar Telegram o'zi ochilmasa, tugmani bosing va <b>START</b> ni bosing.</p>
    <a class="btn tg" id="tg" href="${link}" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 4.3 18.7 19.4c-.2 1.1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13 1.4 11.5c-1-.3-1.1-1 .2-1.5L20.6 2.7c.9-.3 1.6.2 1.3 1.6z"/></svg>
      Telegramni ochish</a>
  </div>`;
  setTimeout(() => { location.href = link; }, 300);
}

function today(){ const d = new Date(); return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`; }
function next(){ pos++; render(); }
$("back").onclick = () => { pos--; render(); };
document.addEventListener("keydown", e => {
  const f = flow(); if (pos < 0 || pos >= f.length) return;
  const id = f[pos], opts = {status:STATUS, dir:DIR, lang:LANG, tried:TRIED, refused:REFUSED}[id];
  if (!opts) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= opts.length) pick(id, n - 1);
});
render();
</script>

</body>
</html>
